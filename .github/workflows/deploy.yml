name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to deploy
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Build and deploy on VDS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full lowercase SHA" >&2
            exit 2
          fi
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" ]]; then
            echo "DEPLOY_HOST and DEPLOY_USER production secrets must be configured" >&2
            exit 2
          fi
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REQUESTED_COMMIT" <<'REMOTE'
          set -euo pipefail
          cd /home/semyon422/rizu
          exec 9>.deploy.lock
          flock --wait 7200 9
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch --no-tags origin "$1"
          git cat-file -e "$1^{commit}"
          git checkout --detach "$1"
          git submodule update --init --recursive
          export RIZU_DEPLOY_LOCKED=1
          export RIZU_DEPLOY_AUTO_ROLLBACK=0
          export RIZU_DEPLOY_BACKUP=1
          export RIZU_DEPLOY_TEST_COMMAND='set -e
          for pattern in "^sea/" "^bancho/" "^rizu/library/" "^rizu/build/" "^deploy/" "^aqua/rdb/" "^chart/"; do
            result=0
            ./test "$pattern" >server-state/temp/deploy-tests.log 2>&1 || result=$?
            cat server-state/temp/deploy-tests.log
            test "$result" -eq 0
            grep -q "^OK: [0-9]" server-state/temp/deploy-tests.log
            ! grep -q "^FAIL:" server-state/temp/deploy-tests.log
          done'
          ./deploy.lua build-deploy "$1"
          REMOTE

      - name: Verify public server
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://rizu.su/ >/dev/null
