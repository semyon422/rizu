<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知面板</title>
<style>
@font-face {
	font-family: "Noto Sans CJK SC";
	src: local("Noto Sans CJK SC"), local("NotoSansCJKsc-Regular"), url("../resources/fonts/NotoSansCJK-Regular.ttc");
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Regular.ttf");
	font-weight: 400;
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Medium.ttf");
	font-weight: 500;
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Bold.ttf");
	font-weight: 700;
}
:root {
	/* ui/Colors.lua */
	--bg: #0D0C0F;
	--panel: #211C2B;
	--item: #2D283E;
	--item-hover: #403854;
	--text: #F2F2FF;
	--muted: #A6B2CC;
	--border: #4A4460;
	--accent: #D9A04F;
	--info: #3EAECB;
	--success: #7DB435;
	--error: #F64949;
	--server: #BE4CC0;
	--radius: 10px;
	--panel-width: 380px;
	--ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }

body {
	margin: 0;
	height: 100vh;
	overflow: hidden;
	background: var(--bg);
	color: var(--text);
	font: 14px/1.4 "Rubik", "Noto Sans CJK SC", system-ui, sans-serif;
}

/* Bell button */
.bell {
	position: fixed;
	top: 16px;
	right: 16px;
	z-index: 20;
	width: 44px;
	height: 44px;
	border: 1px solid var(--border);
	border-radius: 50%;
	background: var(--panel);
	color: var(--text);
	display: grid;
	place-items: center;
	cursor: pointer;
	transition: background .15s, transform .15s;
}
.bell:hover { background: var(--item-hover); }
.bell:active { transform: scale(.94); }
.bell svg { width: 20px; height: 20px; }
.bell .badge {
	position: absolute;
	top: -2px;
	right: -2px;
	min-width: 18px;
	height: 18px;
	padding: 0 5px;
	border-radius: 9px;
	background: var(--error);
	color: #fff;
	font-size: 11px;
	font-weight: 500;
	display: grid;
	place-items: center;
}
.bell .badge:empty { display: none; }
.bell.busy::after {
	content: "";
	position: absolute;
	inset: -3px;
	border-radius: 50%;
	border: 2px solid transparent;
	border-top-color: var(--accent);
	animation: spin 1s linear infinite;
}

/* Close bar */
.close-panel {
	flex: none;
	height: 44px;
	border: 1px solid var(--border);
	border-radius: var(--radius);
	background: var(--item);
	color: var(--muted);
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	font: inherit;
	cursor: pointer;
	transition: background .15s, color .15s;
}
.close-panel:hover { background: var(--item-hover); color: var(--text); }
.close-panel svg { width: 16px; height: 16px; }

/* Panel */
.panel {
	position: fixed;
	top: 0;
	right: 0;
	z-index: 30;
	width: var(--panel-width);
	max-width: 100vw;
	height: 100vh;
	padding: 16px 12px 12px;
	background: var(--panel);
	border-left: 1px solid var(--border);
	box-shadow: -12px 0 32px rgba(0, 0, 0, .4);
	display: flex;
	flex-direction: column;
	gap: 16px;
	transform: translateX(100%);
	transition: transform .35s var(--ease);
}
.panel.open { transform: translateX(0); }

.section-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 4px 8px;
	color: var(--muted);
	font-size: 12px;
	font-weight: 500;
	letter-spacing: .06em;
	text-transform: uppercase;
}
.section-head button {
	border: 0;
	background: none;
	color: var(--muted);
	font: inherit;
	cursor: pointer;
}
.section-head button:hover { color: var(--text); }

.list {
	display: flex;
	flex-direction: column;
	gap: 8px;
}
.notifications {
	flex: 1;
	min-height: 0;
	display: flex;
	flex-direction: column;
}
.notifications .list { overflow-y: auto; }

.empty {
	padding: 24px;
	color: var(--muted);
	text-align: center;
}
.list:not(:empty) + .empty { display: none; }

/* Items */
.item {
	position: relative;
	display: grid;
	grid-template-columns: 28px 1fr;
	gap: 10px;
	padding: 12px;
	border-radius: var(--radius);
	background: var(--item);
	border-left: 3px solid var(--kind);
	animation: item-in .3s var(--ease);
}
.item:hover { background: var(--item-hover); }
.item.leaving { animation: item-out .25s var(--ease) forwards; }

.item .icon {
	width: 28px;
	height: 28px;
	border-radius: 50%;
	background: color-mix(in srgb, var(--kind) 18%, transparent);
	color: var(--kind);
	display: grid;
	place-items: center;
}
.item .icon svg { width: 16px; height: 16px; }
.item .title { font-weight: 500; padding-right: 20px; }
.item .text { color: var(--muted); margin-top: 2px; word-break: break-word; }
.item .time { color: var(--muted); font-size: 11px; margin-top: 6px; }
.item .close {
	position: absolute;
	top: 8px;
	right: 8px;
	width: 20px;
	height: 20px;
	border: 0;
	border-radius: 4px;
	background: none;
	color: var(--muted);
	cursor: pointer;
	opacity: 0;
	transition: opacity .15s;
}
.item:hover .close { opacity: 1; }
.item .close:hover { color: var(--text); background: var(--border); }

.item.info { --kind: var(--info); }
.item.success { --kind: var(--success); }
.item.error { --kind: var(--error); }
.item.server { --kind: var(--server); }
.item.task { --kind: var(--accent); }

.link {
	margin-top: 4px;
	padding: 0;
	border: 0;
	background: none;
	color: var(--kind);
	font: inherit;
	cursor: pointer;
}
.link:hover { text-decoration: underline; }

/* Tasks */
.task .icon svg { animation: spin 1.2s linear infinite; }
.progress {
	height: 4px;
	margin-top: 8px;
	border-radius: 2px;
	background: var(--bg);
	overflow: hidden;
}
.progress div {
	height: 100%;
	width: var(--p, 0%);
	background: var(--accent);
	transition: width .3s;
}
.progress.indeterminate div {
	width: 30%;
	animation: indeterminate 1.4s ease-in-out infinite;
}
.task .meta {
	display: flex;
	justify-content: space-between;
	margin-top: 4px;
	color: var(--muted);
	font-size: 11px;
	font-variant-numeric: tabular-nums;
}

@keyframes item-in {
	from { opacity: 0; transform: translateX(40px); }
}
@keyframes item-out {
	to { opacity: 0; transform: translateX(60px); height: 0; padding-block: 0; margin-block: -4px; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes indeterminate {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
/* CJK glyphs need more pixels than Latin to stay legible */
.item .time, .task .meta { font-size: 12px; }
.section-head { font-size: 13px; letter-spacing: 0; }
</style>
</head>
<body>

<button class="bell busy" id="bell" aria-label="通知" aria-expanded="false" aria-controls="panel">
	<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
	<span class="badge" id="badge">4</span>
</button>

<aside class="panel" id="panel" aria-label="通知与任务">
	<button class="close-panel" id="close-panel">
		关闭
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
	</button>
	<section class="tasks">
		<div class="section-head"><span>任务</span></div>
		<div class="list" id="tasks">
			<div class="item task">
				<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg></div>
				<div>
					<div class="title">正在缓存谱面库</div>
					<div class="text">Songs/Camellia - Exit This Earth's Atomosphere</div>
					<div class="progress"><div id="cache-bar" style="--p: 42%"></div></div>
					<div class="meta"><span id="cache-count">4,210 / 10,024 张谱面</span><span id="cache-pct">42%</span></div>
				</div>
			</div>
			<div class="item task">
				<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg></div>
				<div>
					<div class="title">正在重新计算成绩</div>
					<div class="text">正在准备回放…</div>
					<div class="progress indeterminate"><div></div></div>
				</div>
			</div>
		</div>
		<div class="empty">没有正在运行的任务</div>
	</section>

	<section class="notifications">
		<div class="section-head"><span>通知</span><button id="clear">全部清除</button></div>
		<div class="list" id="notifications">
			<div class="item error">
				<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
				<div>
					<div class="title">错误</div>
					<div class="text">attempt to index a nil value (field 'chartview')</div>
					<button class="link">打开堆栈跟踪</button>
					<div class="time">刚刚</div>
				</div>
				<button class="close" aria-label="关闭">✕</button>
			</div>
			<div class="item success">
				<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
				<div>
					<div class="title">截图已保存</div>
					<button class="link">点击打开</button>
					<div class="time">2 分钟前</div>
				</div>
				<button class="close" aria-label="关闭">✕</button>
			</div>
			<div class="item server">
				<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></div>
				<div>
					<div class="title">服务器消息</div>
					<div class="text">服务器将于 UTC 03:00 进行维护，届时约 20 分钟内无法提交成绩。</div>
					<div class="time">15 分钟前</div>
				</div>
				<button class="close" aria-label="关闭">✕</button>
			</div>
			<div class="item info">
				<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 11v6M12 7h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
				<div>
					<div class="title">已登录</div>
					<div class="text">欢迎回来！</div>
					<div class="time">1 小时前</div>
				</div>
				<button class="close" aria-label="关闭">✕</button>
			</div>
		</div>
		<div class="empty">暂无通知</div>
	</section>
</aside>

<script>
const bell = document.getElementById("bell");
const panel = document.getElementById("panel");
const badge = document.getElementById("badge");
const notifications = document.getElementById("notifications");

function setOpen(open) {
	panel.classList.toggle("open", open);
	bell.setAttribute("aria-expanded", open);
	if (open) badge.textContent = "";
}

bell.addEventListener("click", () => setOpen(true));
document.getElementById("close-panel").addEventListener("click", () => setOpen(false));

document.addEventListener("keydown", e => {
	if (e.key === "Escape") setOpen(false);
});

function dismiss(item) {
	item.classList.add("leaving");
	item.addEventListener("animationend", () => item.remove(), { once: true });
}

notifications.addEventListener("click", e => {
	const close = e.target.closest(".close");
	if (close) dismiss(close.closest(".item"));
});

document.getElementById("clear").addEventListener("click", () => {
	[...notifications.children].forEach((item, i) => setTimeout(() => dismiss(item), i * 50));
});

// Demo: advance the caching task and finish it
let done = 4210;
const total = 10024;
const timer = setInterval(() => {
	done = Math.min(total, done + 137);
	const pct = Math.floor(done / total * 100);
	document.getElementById("cache-bar").style.setProperty("--p", pct + "%");
	document.getElementById("cache-pct").textContent = pct + "%";
	document.getElementById("cache-count").textContent = `${done.toLocaleString("en")} / ${total.toLocaleString("en")} 张谱面`;
	if (done === total) {
		clearInterval(timer);
		dismiss(document.getElementById("cache-bar").closest(".item"));
	}
}, 200);
</script>
</body>
</html>
