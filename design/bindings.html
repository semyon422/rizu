<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Bindings</title>
<style>
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Regular.ttf");
	font-weight: 400;
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Medium.ttf");
	font-weight: 500;
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Bold.ttf");
	font-weight: 700;
}
:root {
	/* ui/Colors.lua */
	--bg: #0D0C0F;
	--panel: #211C2B;
	--surface: #2D283E;
	--raised: #403854;
	--text: #F2F2FF;
	--muted: #A6B2CC;
	--outline: #4A4460;
	--divider: rgba(74, 68, 96, .55);
	--subtle: rgba(242, 242, 255, .07);
	--accent: #D9A04F;
	--radius: 12px;
	--ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }

body {
	margin: 0;
	height: 100vh;
	display: grid;
	place-items: center;
	background: radial-gradient(circle at 70% 30%, #3a4f78, #2a2540 60%, var(--bg));
	color: var(--text);
	font: 14px/1.4 "Rubik", system-ui, sans-serif;
}

.overlay {
	position: fixed;
	inset: 0;
	background: rgba(13, 12, 15, .45);
}

.modal {
	position: relative;
	display: grid;
	grid-template-columns: 260px 1fr;
	width: min(1060px, calc(100vw - 32px));
	height: min(740px, calc(100vh - 32px));
	background: var(--panel);
	border: 1px solid var(--subtle);
	border-radius: var(--radius);
	box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
	overflow: hidden;
}

/* Sidebar */
.sidebar {
	display: flex;
	flex-direction: column;
	gap: 2px;
	padding: 16px 12px;
	background: rgba(0, 0, 0, .18);
	border-right: 1px solid var(--divider);
}

.search {
	display: flex;
	align-items: center;
	gap: 8px;
	height: 38px;
	margin-bottom: 12px;
	padding: 0 12px;
	background: var(--bg);
	border: 1px solid var(--outline);
	border-radius: 8px;
	color: var(--muted);
}
.search:focus-within { border-color: var(--accent); }
.search input {
	flex: 1;
	min-width: 0;
	background: none;
	border: 0;
	outline: 0;
	color: var(--text);
	font: inherit;
}
.search input::placeholder { color: var(--muted); }

.nav-item {
	display: flex;
	align-items: center;
	gap: 12px;
	height: 38px;
	padding: 0 12px;
	border: 0;
	border-radius: 8px;
	background: none;
	color: var(--muted);
	font: 500 14px "Rubik", sans-serif;
	text-align: left;
	cursor: pointer;
	transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--raised); color: var(--text); }
.nav-item.active svg { color: var(--accent); }
.nav-item svg { flex: none; width: 18px; height: 18px; }
.nav-item.close { margin-top: auto; }

svg {
	fill: none;
	stroke: currentColor;
	stroke-width: 1.8;
	stroke-linecap: round;
	stroke-linejoin: round;
}

/* Content */
.content {
	overflow-y: auto;
	padding: 8px 32px 32px;
	scroll-behavior: smooth;
	scrollbar-width: thin;
	scrollbar-color: var(--outline) transparent;
}

.section { padding-top: 24px; }
.section h2 {
	display: flex;
	align-items: center;
	gap: 10px;
	margin: 0 0 12px;
	font-size: 22px;
	font-weight: 700;
}
.section h2 svg { width: 20px; height: 20px; color: var(--accent); }

.group {
	overflow: hidden;
	background: var(--surface);
	border: 1px solid var(--subtle);
	border-radius: 10px;
}

.row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 24px;
	min-height: 56px;
	padding: 10px 16px;
}
.row + .row { border-top: 1px solid var(--divider); }
.row { position: relative; transition: background .15s; }
/* Hover: brighter row plus the in-game selection line on the left */
.row:hover { background: var(--raised); }
.row:hover::before {
	content: "";
	position: absolute;
	left: 6px;
	top: 8px;
	bottom: 8px;
	width: 3px;
	border-radius: 2px;
	background: var(--muted);
}
.row.stack { flex-direction: column; align-items: stretch; gap: 10px; }

.label { font-weight: 500; }
.hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.value { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
.head { display: flex; justify-content: space-between; }

/* Segmented control */
.segmented {
	display: inline-flex;
	flex: none;
	padding: 3px;
	background: var(--bg);
	border-radius: 8px;
}
.segmented button {
	height: 30px;
	padding: 0 14px;
	border: 0;
	border-radius: 6px;
	background: none;
	color: var(--muted);
	font: 500 13px "Rubik", sans-serif;
	cursor: pointer;
	transition: background .15s, color .15s;
}
.segmented button:hover { color: var(--text); }
.segmented button.on { background: var(--raised); color: var(--accent); box-shadow: inset 0 0 0 1px var(--subtle); }

/* Select */
.select {
	position: relative;
	flex: none;
	width: 220px;
}
.select select {
	width: 100%;
	height: 36px;
	padding: 0 32px 0 12px;
	appearance: none;
	background: var(--bg);
	border: 1px solid var(--outline);
	border-radius: 8px;
	color: var(--text);
	font: inherit;
	cursor: pointer;
}
.select select:focus { outline: 0; border-color: var(--accent); }
.select svg {
	position: absolute;
	right: 10px;
	top: 10px;
	width: 16px;
	height: 16px;
	pointer-events: none;
	color: var(--muted);
}

/* Toggle: a lane receptor that lights up from the bottom like a pressed key */
.toggle {
	position: relative;
	flex: none;
	width: 34px;
	height: 26px;
	border: 1px solid var(--outline);
	border-radius: 4px;
	background: var(--bg);
	overflow: hidden;
	cursor: pointer;
	transition: border-color .2s;
}
.toggle::before {
	content: "";
	position: absolute;
	inset: 0;
	background: linear-gradient(to top, rgba(217, 160, 79, .45), transparent);
	transform: scaleY(0);
	transform-origin: bottom;
	transition: transform .25s var(--ease);
}
.toggle::after {
	content: "";
	position: absolute;
	left: 4px;
	right: 4px;
	bottom: 4px;
	height: 4px;
	border-radius: 1px;
	background: var(--outline);
	transition: background .2s, box-shadow .2s;
}
.toggle:hover { border-color: var(--muted); }
.toggle.on { border-color: var(--accent); }
.toggle.on::before { transform: scaleY(1); }
.toggle.on::after { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* Slider */
input[type=range] {
	width: 100%;
	height: 18px;
	margin: 0;
	appearance: none;
	background: none;
	cursor: pointer;
	--p: 50%;
}
input[type=range]::-webkit-slider-runnable-track {
	height: 4px;
	border-radius: 2px;
	background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p) 100% no-repeat, var(--bg);
}
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--bg); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb {
	appearance: none;
	width: 14px;
	height: 14px;
	margin-top: -5px;
	border: 0;
	border-radius: 50%;
	background: var(--accent);
	box-shadow: 0 0 0 4px var(--surface);
	transition: transform .15s var(--ease);
}
input[type=range]::-moz-range-thumb {
	width: 14px;
	height: 14px;
	border: 0;
	border-radius: 50%;
	background: var(--accent);
	box-shadow: 0 0 0 4px var(--surface);
	transition: transform .15s var(--ease);
}
input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.2); }
input[type=range]:hover::-moz-range-thumb { transform: scale(1.2); }

.info {
	display: grid;
	grid-template-columns: auto 1fr;
	gap: 4px 16px;
	font-size: 13px;
}
.info dt { color: var(--muted); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; }

.viewport {
	aspect-ratio: 16 / 9;
	border: 2px dashed var(--accent);
	border-radius: 8px;
	background: rgba(217, 160, 79, .12);
	display: grid;
	place-items: center;
	color: var(--muted);
}

@media (max-width: 720px) {
	.modal { grid-template-columns: 1fr; }
	.sidebar { display: none; }
	.content { padding: 8px 16px 16px; }
	.row:not(.stack) { flex-wrap: wrap; }
}

/* Modifiers modal: single column with header and footer */
.modal.single {
	display: flex;
	flex-direction: column;
	grid-template-columns: none;
	width: min(640px, calc(100vw - 32px));
}
.modal-head {
	padding: 24px 32px 16px;
	border-bottom: 1px solid var(--divider);
}
.modal-head h1 { margin: 0; font-size: 26px; font-weight: 700; }
.modal-head p { margin: 4px 0 0; color: var(--muted); }
.modal.single .content { flex: 1; padding-bottom: 24px; }
.section h3 {
	margin: 0 0 8px;
	color: var(--muted);
	font-size: 12px;
	font-weight: 500;
	letter-spacing: .08em;
	text-transform: uppercase;
}
.modal-foot {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 12px 20px;
	border-top: 1px solid var(--divider);
	background: rgba(0, 0, 0, .18);
}
.modal-foot .nav-item { margin: 0; }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
	height: 30px;
	padding: 0 14px;
	border: 1px solid var(--outline);
	border-radius: 6px;
	background: var(--bg);
	color: var(--text);
	font: 500 13px "Rubik", sans-serif;
	cursor: pointer;
	transition: border-color .15s, color .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.lanes { display: flex; gap: 4px; }
.lanes span {
	display: grid;
	place-items: center;
	width: 24px;
	height: 24px;
	border-radius: 4px;
	background: var(--bg);
	border: 1px solid var(--outline);
	color: var(--muted);
	font-size: 12px;
	font-variant-numeric: tabular-nums;
}

.modal.single.wide { width: min(1000px, calc(100vw - 32px)); height: auto; max-height: calc(100vh - 32px); }
.modal-head.with-mode { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.modal.single .content { padding-top: 24px; }

/* Chips: one per bound key, a lane can hold several */
.chip {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 4px;
	height: 26px;
	padding: 0 8px;
	border-radius: 5px;
	background: var(--raised);
	border: 1px solid var(--subtle);
	font: 500 12px "Rubik", sans-serif;
	color: var(--text);
	cursor: pointer;
	white-space: nowrap;
}
.chip:hover { border-color: #F64949; color: #F64949; }
.add {
	height: 26px;
	border: 1px dashed var(--outline);
	border-radius: 5px;
	background: none;
	color: var(--muted);
	font: 500 12px "Rubik", sans-serif;
	cursor: pointer;
}
.add:hover { border-color: var(--accent); color: var(--accent); }
.listening .add { border-style: solid; border-color: var(--accent); color: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 10px rgba(217, 160, 79, .5); } }

/* Up to 10 lanes: a playfield of tall lanes with the keys stacked on each */
.field { display: flex; justify-content: center; gap: 6px; }
.lane {
	display: flex;
	flex-direction: column;
	gap: 6px;
	width: 84px;
	padding: 10px 8px 12px;
	border-radius: 8px;
	background: var(--bg);
	border: 1px solid var(--outline);
	min-height: 220px;
	position: relative;
}
.lane.scratch { width: 104px; }
.lane .name { color: var(--muted); font-size: 12px; font-weight: 500; text-align: center; margin-bottom: 4px; }
.lane .keys { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.lane::after {
	content: "";
	position: absolute;
	left: 8px;
	right: 8px;
	bottom: 4px;
	height: 3px;
	border-radius: 1px;
	background: var(--c);
	opacity: .5;
}
.lane.listening { border-color: var(--accent); }
.lane.empty .name { color: #F64949; }

/* More than 10 lanes: a compact list, one row per lane */
.rows .row { min-height: 44px; padding: 6px 16px; justify-content: flex-start; }
.rows .name { width: 48px; flex: none; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.rows .swatch { width: 4px; height: 20px; border-radius: 2px; background: var(--c); flex: none; }
.rows .keys { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.rows .add { padding: 0 10px; }
.rows .listening { background: var(--raised); }
.rows { max-height: 52vh; overflow-y: auto; }
</style>
</head>
<body>
<div class="overlay"></div>

<div class="modal single wide">
	<header class="modal-head with-mode">
		<div>
			<h1>Input Bindings</h1>
			<p id="sub">Configure controls for 7K.</p>
		</div>
		<div class="select"><select id="mode"></select><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
	</header>

	<main class="content" id="view"></main>

	<footer class="modal-foot">
		<button class="nav-item close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>Close</button>
		<button class="btn" id="reset">Reset to default</button>
	</footer>
</div>

<script>
const modes = {
	"4K": { keys: 4, defaults: [["D"], ["F"], ["J"], ["K"]] },
	"7K": { keys: 7, defaults: [["S"], ["D"], ["F"], ["Space"], ["J"], ["K"], ["L"]] },
	"7K1S": { keys: 7, scratch: 1, defaults: [["Z"], ["S"], ["X"], ["D"], ["C"], ["F"], ["V"], ["LShift", "LCtrl"]] },
	"10K": { keys: 10, defaults: [["A"], ["S"], ["D"], ["F"], ["V"], ["N"], ["J"], ["K"], ["L"], [";"]] },
	"14K2S": { keys: 14, scratch: 2, defaults: [["Z"], ["S"], ["X"], ["D"], ["C"], ["F"], ["V"], ["M"], ["K"], [","], ["L"], ["."], [";"], ["/"], ["LShift"], ["RShift"]] },
	"24K": { keys: 24 },
	"88K": { keys: 88 },
};
const binds = {};
const view = document.getElementById("view");
const mode = document.getElementById("mode");
let current = "7K", listening = null;

mode.append(...Object.keys(modes).map(m => new Option(m, m, false, m === current)));

const lanes = m => {
	const { keys, scratch = 0 } = modes[m];
	const out = [];
	for (let i = 0; i < keys; i++) {
		const c = keys % 2 && i === (keys - 1) / 2 ? "#f2cf3a" : i % 2 ? "#2fb2dc" : "#ddd";
		out.push({ name: i + 1 + "K", c });
	}
	for (let i = 0; i < scratch; i++) out.push({ name: i + 1 + "S", c: "var(--accent)", scratch: true });
	return out;
};

const getBinds = m => binds[m] ??= lanes(m).map((_, i) => [...(modes[m].defaults?.[i] ?? [])]);

const render = () => {
	const ls = lanes(current), bs = getBinds(current);
	// shortcut: 10 lanes plus scratches still fit as a playfield, switch at 11+ key lanes
	const compact = modes[current].keys > 10;
	document.getElementById("sub").textContent = `Configure controls for ${current}. Each lane can take several keys.`;
	const wrap = document.createElement("div");
	wrap.className = compact ? "group rows" : "field";
	ls.forEach((lane, i) => {
		const el = document.createElement("div");
		el.className = (compact ? "row" : "lane") + (lane.scratch ? " scratch" : "") + (listening === i ? " listening" : "") + (bs[i].length ? "" : " empty");
		el.style.setProperty("--c", lane.c);
		el.innerHTML = (compact ? `<span class="swatch"></span>` : "") + `<span class="name">${lane.name}</span><div class="keys"></div>`;
		const keys = el.querySelector(".keys");
		bs[i].forEach((k, j) => {
			const chip = document.createElement("button");
			chip.className = "chip";
			chip.title = "Click to remove";
			chip.textContent = k;
			chip.onclick = () => { bs[i].splice(j, 1); render(); };
			keys.append(chip);
		});
		const add = document.createElement("button");
		add.className = "add";
		add.textContent = listening === i ? "Press a key…" : "+ Add";
		add.onclick = () => { listening = listening === i ? null : i; render(); };
		keys.append(add);
		wrap.append(el);
	});
	view.replaceChildren(wrap);
};

addEventListener("keydown", e => {
	if (listening === null) return;
	e.preventDefault();
	if (e.key !== "Escape") {
		const name = e.code.replace(/^Key|^Digit/, "").replace(/^(Shift|Control|Alt)(Left|Right)$/, (_, k, s) => s[0] + (k === "Control" ? "Ctrl" : k));
		const list = getBinds(current)[listening];
		if (!list.includes(name)) list.push(name);
	}
	listening = null;
	render();
});
mode.onchange = () => { current = mode.value; listening = null; render(); };
document.getElementById("reset").onclick = () => { delete binds[current]; listening = null; render(); };
render();
</script>
</body>
</html>
