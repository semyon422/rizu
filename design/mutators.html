<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Mutators</title>
<style>
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Regular.ttf");
	font-weight: 400;
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Medium.ttf");
	font-weight: 500;
}
@font-face {
	font-family: "Rubik";
	src: url("../resources/fonts/Rubik/Rubik-Bold.ttf");
	font-weight: 700;
}
:root {
	/* ui/Colors.lua */
	--bg: #0D0C0F;
	--panel: #211C2B;
	--surface: #2D283E;
	--raised: #403854;
	--text: #F2F2FF;
	--muted: #A6B2CC;
	--outline: #4A4460;
	--divider: rgba(74, 68, 96, .55);
	--subtle: rgba(242, 242, 255, .07);
	--accent: #D9A04F;
	--radius: 12px;
	--ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }

body {
	margin: 0;
	height: 100vh;
	display: grid;
	place-items: center;
	background: radial-gradient(circle at 70% 30%, #3a4f78, #2a2540 60%, var(--bg));
	color: var(--text);
	font: 14px/1.4 "Rubik", system-ui, sans-serif;
}

.overlay {
	position: fixed;
	inset: 0;
	background: rgba(13, 12, 15, .45);
}

.modal {
	position: relative;
	display: grid;
	grid-template-columns: 260px 1fr;
	width: min(1060px, calc(100vw - 32px));
	height: min(740px, calc(100vh - 32px));
	background: var(--panel);
	border: 1px solid var(--subtle);
	border-radius: var(--radius);
	box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
	overflow: hidden;
}

/* Sidebar */
.sidebar {
	display: flex;
	flex-direction: column;
	gap: 2px;
	padding: 16px 12px;
	background: rgba(0, 0, 0, .18);
	border-right: 1px solid var(--divider);
}

.search {
	display: flex;
	align-items: center;
	gap: 8px;
	height: 38px;
	margin-bottom: 12px;
	padding: 0 12px;
	background: var(--bg);
	border: 1px solid var(--outline);
	border-radius: 8px;
	color: var(--muted);
}
.search:focus-within { border-color: var(--accent); }
.search input {
	flex: 1;
	min-width: 0;
	background: none;
	border: 0;
	outline: 0;
	color: var(--text);
	font: inherit;
}
.search input::placeholder { color: var(--muted); }

.nav-item {
	display: flex;
	align-items: center;
	gap: 12px;
	height: 38px;
	padding: 0 12px;
	border: 0;
	border-radius: 8px;
	background: none;
	color: var(--muted);
	font: 500 14px "Rubik", sans-serif;
	text-align: left;
	cursor: pointer;
	transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--raised); color: var(--text); }
.nav-item.active svg { color: var(--accent); }
.nav-item svg { flex: none; width: 18px; height: 18px; }
.nav-item.close { margin-top: auto; }

svg {
	fill: none;
	stroke: currentColor;
	stroke-width: 1.8;
	stroke-linecap: round;
	stroke-linejoin: round;
}

/* Content */
.content {
	overflow-y: auto;
	padding: 8px 32px 32px;
	scroll-behavior: smooth;
	scrollbar-width: thin;
	scrollbar-color: var(--outline) transparent;
}

.section { padding-top: 24px; }
.section h2 {
	display: flex;
	align-items: center;
	gap: 10px;
	margin: 0 0 12px;
	font-size: 22px;
	font-weight: 700;
}
.section h2 svg { width: 20px; height: 20px; color: var(--accent); }

.group {
	overflow: hidden;
	background: var(--surface);
	border: 1px solid var(--subtle);
	border-radius: 10px;
}

.row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 24px;
	min-height: 56px;
	padding: 10px 16px;
}
.row + .row { border-top: 1px solid var(--divider); }
.row { position: relative; transition: background .15s; }
/* Hover: brighter row plus the in-game selection line on the left */
.row:hover { background: var(--raised); }
.row:hover::before {
	content: "";
	position: absolute;
	left: 6px;
	top: 8px;
	bottom: 8px;
	width: 3px;
	border-radius: 2px;
	background: var(--muted);
}
.row.stack { flex-direction: column; align-items: stretch; gap: 10px; }

.label { font-weight: 500; }
.hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.value { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
.head { display: flex; justify-content: space-between; }

/* Segmented control */
.segmented {
	display: inline-flex;
	flex: none;
	padding: 3px;
	background: var(--bg);
	border-radius: 8px;
}
.segmented button {
	height: 30px;
	padding: 0 14px;
	border: 0;
	border-radius: 6px;
	background: none;
	color: var(--muted);
	font: 500 13px "Rubik", sans-serif;
	cursor: pointer;
	transition: background .15s, color .15s;
}
.segmented button:hover { color: var(--text); }
.segmented button.on { background: var(--raised); color: var(--accent); box-shadow: inset 0 0 0 1px var(--subtle); }

/* Select */
.select {
	position: relative;
	flex: none;
	width: 220px;
}
.select select {
	width: 100%;
	height: 36px;
	padding: 0 32px 0 12px;
	appearance: none;
	background: var(--bg);
	border: 1px solid var(--outline);
	border-radius: 8px;
	color: var(--text);
	font: inherit;
	cursor: pointer;
}
.select select:focus { outline: 0; border-color: var(--accent); }
.select svg {
	position: absolute;
	right: 10px;
	top: 10px;
	width: 16px;
	height: 16px;
	pointer-events: none;
	color: var(--muted);
}

/* Toggle: a lane receptor that lights up from the bottom like a pressed key */
.toggle {
	position: relative;
	flex: none;
	width: 34px;
	height: 26px;
	border: 1px solid var(--outline);
	border-radius: 4px;
	background: var(--bg);
	overflow: hidden;
	cursor: pointer;
	transition: border-color .2s;
}
.toggle::before {
	content: "";
	position: absolute;
	inset: 0;
	background: linear-gradient(to top, rgba(217, 160, 79, .45), transparent);
	transform: scaleY(0);
	transform-origin: bottom;
	transition: transform .25s var(--ease);
}
.toggle::after {
	content: "";
	position: absolute;
	left: 4px;
	right: 4px;
	bottom: 4px;
	height: 4px;
	border-radius: 1px;
	background: var(--outline);
	transition: background .2s, box-shadow .2s;
}
.toggle:hover { border-color: var(--muted); }
.toggle.on { border-color: var(--accent); }
.toggle.on::before { transform: scaleY(1); }
.toggle.on::after { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* Slider */
input[type=range] {
	width: 100%;
	height: 18px;
	margin: 0;
	appearance: none;
	background: none;
	cursor: pointer;
	--p: 50%;
}
input[type=range]::-webkit-slider-runnable-track {
	height: 4px;
	border-radius: 2px;
	background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p) 100% no-repeat, var(--bg);
}
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--bg); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb {
	appearance: none;
	width: 14px;
	height: 14px;
	margin-top: -5px;
	border: 0;
	border-radius: 50%;
	background: var(--accent);
	box-shadow: 0 0 0 4px var(--surface);
	transition: transform .15s var(--ease);
}
input[type=range]::-moz-range-thumb {
	width: 14px;
	height: 14px;
	border: 0;
	border-radius: 50%;
	background: var(--accent);
	box-shadow: 0 0 0 4px var(--surface);
	transition: transform .15s var(--ease);
}
input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.2); }
input[type=range]:hover::-moz-range-thumb { transform: scale(1.2); }

.info {
	display: grid;
	grid-template-columns: auto 1fr;
	gap: 4px 16px;
	font-size: 13px;
}
.info dt { color: var(--muted); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; }

.viewport {
	aspect-ratio: 16 / 9;
	border: 2px dashed var(--accent);
	border-radius: 8px;
	background: rgba(217, 160, 79, .12);
	display: grid;
	place-items: center;
	color: var(--muted);
}

@media (max-width: 720px) {
	.modal { grid-template-columns: 1fr; }
	.sidebar { display: none; }
	.content { padding: 8px 16px 16px; }
	.row:not(.stack) { flex-wrap: wrap; }
}

/* Modifiers modal: single column with header and footer */
.modal.single {
	display: flex;
	flex-direction: column;
	grid-template-columns: none;
	width: min(640px, calc(100vw - 32px));
}
.modal-head {
	padding: 24px 32px 16px;
	border-bottom: 1px solid var(--divider);
}
.modal-head h1 { margin: 0; font-size: 26px; font-weight: 700; }
.modal-head p { margin: 4px 0 0; color: var(--muted); }
.modal.single .content { flex: 1; padding-bottom: 24px; }
.section h3 {
	margin: 0 0 8px;
	color: var(--muted);
	font-size: 12px;
	font-weight: 500;
	letter-spacing: .08em;
	text-transform: uppercase;
}
.modal-foot {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 12px 20px;
	border-top: 1px solid var(--divider);
	background: rgba(0, 0, 0, .18);
}
.modal-foot .nav-item { margin: 0; }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
	height: 30px;
	padding: 0 14px;
	border: 1px solid var(--outline);
	border-radius: 6px;
	background: var(--bg);
	color: var(--text);
	font: 500 13px "Rubik", sans-serif;
	cursor: pointer;
	transition: border-color .15s, color .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.lanes { display: flex; gap: 4px; }
.lanes span {
	display: grid;
	place-items: center;
	width: 24px;
	height: 24px;
	border-radius: 4px;
	background: var(--bg);
	border: 1px solid var(--outline);
	color: var(--muted);
	font-size: 12px;
	font-variant-numeric: tabular-nums;
}

/* Mutators: catalog on the left, ordered stack on the right */
.modal.single.wide { width: min(1100px, calc(100vw - 32px)); }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 380px; }
.body .content { min-height: 0; }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 8px;
	border: 1px solid var(--subtle);
	border-radius: 10px;
	background: var(--surface);
	color: var(--text);
	font: 500 13px "Rubik", sans-serif;
	text-align: left;
	cursor: pointer;
	transition: background .15s, border-color .15s;
}
.tile:hover { background: var(--raised); border-color: var(--outline); }
.tile img { width: 36px; height: 36px; flex: none; }
.tile.used { opacity: .45; }
.stack {
	display: flex;
	flex-direction: column;
	min-height: 0;
	border-left: 1px solid var(--divider);
	background: rgba(0, 0, 0, .18);
}
.stack-head { display: flex; justify-content: space-between; align-items: baseline; padding: 24px 20px 12px; }
.stack-head h3 { margin: 0; }
.stack-head .hint { cursor: pointer; }
.stack-head .hint:hover { color: var(--accent); }
.stack ol { flex: 1; overflow-y: auto; margin: 0; padding: 0 12px 12px; list-style: none; }
.item {
	position: relative;
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 6px 8px;
	border-radius: 8px;
}
.item:hover { background: var(--surface); }
.move { display: flex; flex-direction: column; }
.move button { width: 20px; height: 16px; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; }
.move button:hover:not(:disabled) { color: var(--accent); }
.move button:disabled { opacity: .25; cursor: default; }
.move svg { width: 16px; height: 16px; }
.item img { width: 32px; height: 32px; flex: none; }
.item .label { flex: 1; }
.stepper { display: flex; align-items: center; background: var(--bg); border-radius: 6px; }
.stepper button, .remove {
	width: 24px;
	height: 24px;
	border: 0;
	background: none;
	color: var(--muted);
	font: 500 15px "Rubik", sans-serif;
	cursor: pointer;
}
.stepper button:hover, .remove:hover { color: var(--accent); }
.stepper span { min-width: 22px; text-align: center; color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
.remove { visibility: hidden; }
.item:hover .remove { visibility: visible; }
/* Insertion point: where the next picked mutator lands; click a gap to move it */
.slot { height: 8px; margin: 1px 0; border-radius: 2px; cursor: pointer; }
.slot:hover { background: var(--subtle); }
.slot.on { height: 3px; margin: 4px 8px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.empty { padding: 24px 8px; color: var(--muted); text-align: center; }
.presets { display: flex; gap: 8px; align-items: center; }
.presets .btn { height: 36px; }
</style>
</head>
<body>
<div class="overlay"></div>

<div class="modal single wide">
	<header class="modal-head">
		<h1>Mutators</h1>
		<p>Mutators change the chart itself and apply in order, top to bottom.</p>
	</header>

	<div class="body">
	<main class="content">
		<section class="section"><h3>Keymode</h3><div class="catalog"><button class="tile" data-name="Automap" data-icon="automap" data-value="4"><img src="../resources/yi/batch/mod_automap.png" alt="">Automap</button><button class="tile" data-name="MultiplePlay" data-icon="multiple_play" data-value="2"><img src="../resources/yi/batch/mod_multiple_play.png" alt="">MultiplePlay</button><button class="tile" data-name="MultiOverPlay" data-icon="multiple_play" data-value="2"><img src="../resources/yi/batch/mod_multiple_play.png" alt="">MultiOverPlay</button><button class="tile" data-name="Alternate" data-icon="alternate" data-value="1"><img src="../resources/yi/batch/mod_alternate.png" alt="">Alternate</button><button class="tile" data-name="Alternate2" data-icon="alternate" data-value="1"><img src="../resources/yi/batch/mod_alternate.png" alt="">Alternate2</button></div></section>
		<section class="section"><h3>Note count</h3><div class="catalog"><button class="tile" data-name="MaxChord" data-icon="max_chord" data-value="2"><img src="../resources/yi/batch/mod_max_chord.png" alt="">MaxChord</button><button class="tile" data-name="NoScratch" data-icon="no_scratch"><img src="../resources/yi/batch/mod_no_scratch.png" alt="">NoScratch</button></div></section>
		<section class="section"><h3>Notes</h3><div class="catalog"><button class="tile" data-name="NoLongNote" data-icon="no_ln"><img src="../resources/yi/batch/mod_no_ln.png" alt="">NoLongNote</button></div></section>
		<section class="section"><h3>Column reorder</h3><div class="catalog"><button class="tile" data-name="Mirror" data-icon="mirror"><img src="../resources/yi/batch/mod_mirror.png" alt="">Mirror</button><button class="tile" data-name="Shift" data-icon="shift" data-value="1"><img src="../resources/yi/batch/mod_shift.png" alt="">Shift</button><button class="tile" data-name="BracketSwap" data-icon="bracket_swap"><img src="../resources/yi/batch/mod_bracket_swap.png" alt="">BracketSwap</button></div></section>
		<section class="section"><h3>Fun</h3><div class="catalog"><button class="tile" data-name="Taiko" data-icon="taiko"><img src="../resources/yi/batch/mod_taiko.png" alt="">Taiko</button><button class="tile" data-name="WindUp" data-icon="windup"><img src="../resources/yi/batch/mod_windup.png" alt="">WindUp</button></div></section>
		<section class="section"><h3>Misc</h3><div class="catalog"><button class="tile" data-name="Custom" data-icon="custom"><img src="../resources/yi/batch/mod_custom.png" alt="">Custom</button></div></section>
	</main>
	<aside class="stack">
		<div class="stack-head"><h3>Applied in order!</h3><span class="hint" id="clear">Clear all</span></div>
		<ol id="stack"></ol>
	</aside>
	</div>

	<footer class="modal-foot">
		<button class="nav-item close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>Close</button>
		<div class="presets">
			<div class="select"><select id="preset"><option value="">No preset</option></select><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
			<button class="btn" id="save">Save preset</button>
		</div>
	</footer>
</div>

<script>
const list = document.getElementById("stack");
let items = [{ name: "NoScratch", icon: "no_scratch" }];
let insert = 1;

const render = () => {
	list.replaceChildren();
	const slot = i => {
		const el = document.createElement("li");
		el.className = "slot" + (i === insert ? " on" : "");
		el.onclick = () => { insert = i; render(); };
		return el;
	};
	list.append(slot(0));
	items.forEach((m, i) => {
		const el = document.createElement("li");
		el.className = "item";
		el.innerHTML = `<div class="move"><button title="Move up"${i === 0 ? " disabled" : ""}><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button><button title="Move down"${i === items.length - 1 ? " disabled" : ""}><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div><img src="../resources/yi/batch/mod_${m.icon}.png" alt=""><span class="label">${m.name}</span>`
			+ (m.value !== undefined ? `<div class="stepper"><button>−</button><span>${m.value}</span><button>+</button></div>` : "")
			+ `<button class="remove" title="Remove">✕</button>`;
		const [dec, inc] = el.querySelectorAll(".stepper button");
		if (dec) {
			dec.onclick = () => { m.value = Math.max(1, m.value - 1); render(); };
			inc.onclick = () => { m.value++; render(); };
		}
		el.querySelector(".remove").onclick = () => {
			items.splice(i, 1);
			if (insert > i) insert--;
			render();
		};
		const [up, down] = el.querySelectorAll(".move button");
		const swap = j => {
			[items[i], items[j]] = [items[j], items[i]];
			render();
		};
		up.onclick = () => swap(i - 1);
		down.onclick = () => swap(i + 1);
		list.append(el, slot(i + 1));
	});
	if (!items.length) list.firstChild.insertAdjacentHTML("afterend", '<li class="empty">Pick a mutator on the left</li>');
	for (const tile of document.querySelectorAll(".tile"))
		tile.classList.toggle("used", items.some(m => m.name === tile.dataset.name));
};

for (const tile of document.querySelectorAll(".tile"))
	tile.onclick = () => {
		const { name, icon, value } = tile.dataset;
		items.splice(insert, 0, { name, icon, value: value && Number(value) });
		insert++;
		render();
	};
document.getElementById("clear").onclick = () => { items = []; insert = 0; render(); };

// Presets: named mutator lists, loading one replaces the current list
const presets = {
	"7K to 4K": [{ name: "Automap", icon: "automap", value: 4 }, { name: "NoScratch", icon: "no_scratch" }],
	"Double play": [{ name: "MultiplePlay", icon: "multiple_play", value: 2 }, { name: "Mirror", icon: "mirror" }],
};
const preset = document.getElementById("preset");
const fillPresets = selected => {
	preset.replaceChildren(new Option("No preset", ""), ...Object.keys(presets).map(n => new Option(n, n, false, n === selected)));
};
preset.onchange = () => {
	if (!preset.value) return;
	items = presets[preset.value].map(m => ({ ...m }));
	insert = items.length;
	render();
};
document.getElementById("save").onclick = () => {
	const name = prompt("Preset name", preset.value || "");
	if (!name) return;
	presets[name] = items.map(m => ({ ...m }));
	fillPresets(name);
};
fillPresets();
render();
</script>
</body>
</html>
