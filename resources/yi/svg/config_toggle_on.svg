<svg xmlns="http://www.w3.org/2000/svg" width="34" height="26" viewBox="0 0 34 26">
	<defs>
		<linearGradient id="light" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#D9A04F" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#D9A04F" stop-opacity="0"/>
		</linearGradient>
		<filter id="glow" x="-1" y="-3" width="3" height="7">
			<feGaussianBlur stdDeviation="4"/>
		</filter>
		<clipPath id="inside">
			<rect x="1" y="1" width="32" height="24" rx="3"/>
		</clipPath>
	</defs>
	<rect x="0.5" y="0.5" width="33" height="25" rx="3.5" fill="#0D0C0F"/>
	<g clip-path="url(#inside)">
		<rect x="1" y="1" width="32" height="24" fill="url(#light)"/>
		<rect x="5" y="17" width="24" height="4" rx="1" fill="#D9A04F" filter="url(#glow)"/>
		<rect x="5" y="17" width="24" height="4" rx="1" fill="#D9A04F"/>
	</g>
	<rect x="0.5" y="0.5" width="33" height="25" rx="3.5" fill="none" stroke="#D9A04F"/>
</svg>
